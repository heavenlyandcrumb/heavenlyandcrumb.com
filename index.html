<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heavenly & Crumb | Artisan Sourdough & Sweet Treats</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #F8F4EC;
      color: #1B2336;
    }

    /* HEADER */
    nav {
      background: #1B2336;
      min-height: 125px;
      padding: 16px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      height: 66px;
      width: 190px;
      transform: scale(1.8);
      transform-origin: left center;
      object-fit: contain;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .nav-links a {
      color: #F8F4EC;
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 0.3px;
    }

    /* HOMEPAGE */
    main {
      display: flex;
      flex-direction: column;
    }

    .hero {
      padding: 25px 7% 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    /* BAKE PHOTO STRIP */
    .photo-strip {
      width: min(100%, 1000px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    .photo-strip img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .tagline {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .order-button {
      display: inline-block;
      background: #1B2336;
      color: #F8F4EC;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      transition: transform 0.2s ease;
    }

    .order-button:hover {
      transform: translateY(-2px);
    }

    .bottom-line {
      border-top: 1px solid rgba(27, 35, 54, 0.12);
      padding: 10px 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.4px;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      nav {
        padding: 10px 3% 10px 1%;
        min-height: 100px;
      }

      .logo {
        height: 60px;
        width: 190px;
        transform: scale(1.8);
        object fit: contain;
        transform-origin: left center;
        display: block;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a {
        font-size: 11px;
      }

      .hero {
        padding: 35px 5% 30px;
      }

      .photo-strip {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .photo-strip img {
        height: 190px;
      }

      .tagline {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <img
      src="nobluetransparent.PNG"
      alt="Heavenly & Crumb"
      class="logo"
    >

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Menu</a>
      <a href="#">Our Story</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <main>
    <section class="hero">

      <div class="photo-strip">
        <img src="hella.JPEG" alt="Heavenly & Crumb sourdough">
        <img src="hcs.JPEG" alt="Heavenly & Crumb baked goods">
        <img src="tooks.JPEG" alt="Heavenly Chocolate Chunk cookies">
        <img src="bags.JPEG" alt="Heavenly & Crumb bakery order">
      </div>

      <p class="tagline">
        Artisan sourdough and simply sweet treats, baked with love in
        Brackettville, Texas.
      </p>

      <a class="order-button" href="#">
        ORDER NOW
      </a>

    </section>

    <div class="bottom-line">
      SMALL BATCH • HOMEMADE • BRACKETTVILLE, TEXAS ♡
    </div>
  </main>

</body>
</html>
