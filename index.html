<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heavenly & Crumb | Artisan Sourdough & Sweet Treats</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #F8F4EC;
      color: #1B2336;
    }

    /* NAVIGATION */

    nav {
      background: #1B2336;
      color: #F8F4EC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      color: #F8F4EC;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* HERO */

    .hero {
      min-height: 78vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
    }

    .hero-content {
      max-width: 750px;
    }

    .heart {
      font-size: 2rem;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95;
      margin-bottom: 25px;
    }

    .tagline {
      font-size: 1.25rem;
      line-height: 1.7;
      max-width: 620px;
      margin: 0 auto 35px;
    }

    .order-button {
      display: inline-block;
      background: #1B2336;
      color: #FFFFFF;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 50px;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.2s ease;
    }

    .order-button:hover {
      transform: translateY(-2px);
    }

    /* LITTLE BRAND LINE */

    .details {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid rgba(27, 35, 54, 0.15);
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      nav {
        padding: 20px 6%;
      }

      .nav-links {
        display: none;
      }

      .hero {
        min-height: 72vh;
      }

      .tagline {
        font-size: 1.05rem;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="brand">Heavenly & Crumb ♡</div>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#about">Our Story</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <main id="home" class="hero">
    <div class="hero-content">

      <div class="heart">♡</div>

      <h1>Heavenly<br>& Crumb</h1>

      <p class="tagline">
        Artisan sourdough and simply sweet treats,
        baked with love in Brackettville, Texas.
      </p>

      <a
        class="order-button"
        href="https://form.jotform.com/262486990061059"
        target="_blank"
        rel="noopener noreferrer"
      >
        ORDER NOW
      </a>

    </div>
  </main>

  <footer class="details">
    SMALL BATCH • HOMEMADE • BRACKETTVILLE, TEXAS ♡
  </footer>

</body>
</html>
