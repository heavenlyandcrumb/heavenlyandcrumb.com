<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CEO Workpage | Heavenly & Crumb</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F8F4EC;
      color: #1B2336;
    }

    .internal-header {
      padding: 32px 20px 24px;
      text-align: center;
    }

    .internal-label {
      margin: 0 0 8px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    .internal-header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: normal;
    }

    .internal-subtitle {
      margin: 8px 0 0;
      font-family: Georgia, serif;
      font-size: 15px;
      font-style: italic;
      opacity: 0.7;
    }

    .workpage {
      width: min(100% - 32px, 900px);
      margin: 0 auto 60px;
    }

    .section {
      margin-top: 32px;
    }

    .section-title {
      margin: 0 0 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    .overview-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat-card {
  min-height: 118px;
  padding: 16px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.stat-label {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  line-height: 1.4;
  opacity: 0.55;
}

.stat-number {
  margin-top: 18px;
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
  color: #1B2336;
}

.stat-date {
  font-size: 24px;
}
    .card {
      background: #ffffff;
      border: 1px solid rgba(27, 35, 54, 0.12);
      border-radius: 14px;
      padding: 18px;
    }


    .orders-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.order-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.order-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.order-date {
  margin: 0 0 5px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.order-customer {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: normal;
}

.order-total {
  font-family: Georgia, serif;
  font-size: 22px;
  white-space: nowrap;
}

.order-items {
  margin: 16px 0;
  padding: 14px 0;
  border-top: 1px solid rgba(27, 35, 54, 0.10);
  border-bottom: 1px solid rgba(27, 35, 54, 0.10);
}

.order-item {
  margin: 4px 0;
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
}

.order-details {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.order-tag {
  padding: 6px 8px;
  border: 1px solid rgba(27, 35, 54, 0.14);
  border-radius: 999px;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.order-status {
  background: #1B2336;
  color: #F8F4EC;
  border-color: #1B2336;
}

    
.production-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.production-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.production-heading {
  margin: 0 0 12px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.production-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 9px 0;
  border-top: 1px solid rgba(27, 35, 54, 0.08);
}

.production-row:first-of-type {
  border-top: none;
}

.production-name {
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.4;
}

.production-quantity {
  flex-shrink: 0;
  font-family: Georgia, serif;
  font-size: 23px;
}

    .management-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.management-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.management-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 14px;
}

.management-id {
  margin: 0 0 5px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.management-customer {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: normal;
}

.management-status {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.status-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.status-button {
  padding: 10px 5px;
  border: 1px solid rgba(27, 35, 54, 0.18);
  border-radius: 999px;
  background: transparent;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  cursor: pointer;
}

.status-button.active {
  background: #1B2336;
  color: #F8F4EC;
  border-color: #1B2336;
}

.empty-management {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}

.empty-production {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}
    
.empty-orders {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}
    
    .placeholder {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.65;
    }

    .internal-footer {
      margin-top: 40px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.5px;
      opacity: 0.45;
    }

    @media (min-width: 700px) {
      .internal-header {
        padding-top: 48px;
      }

      .internal-header h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header class="internal-header">
    <p class="internal-label">
      HEAVENLY &amp; CRUMB • INTERNAL
    </p>

    <h1>CEO Workpage</h1>

    <p class="internal-subtitle">
      Command center ♡
    </p>
  </header>

  <main class="workpage">

  <section class="section">
  <h2 class="section-title">OVERVIEW</h2>

  <div class="overview-grid">

    <div class="stat-card">
      <span class="stat-label">UPCOMING ORDERS</span>
      <strong class="stat-number" id="upcomingCount">0</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">EXPECTED SALES</span>
      <strong class="stat-number" id="expectedSales">$0</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">NEXT BAKE DAY</span>
      <strong class="stat-number stat-date" id="nextBakeDay">—</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">ITEMS TO BAKE</span>
      <strong class="stat-number" id="itemsToBake">0</strong>
    </div>

  </div>
</section>

    <section class="section">
  <h2 class="section-title">UPCOMING ORDERS</h2>

  <div id="ordersList" class="orders-list"></div>
</section>


    <section class="section">
  <h2 class="section-title">PRODUCTION</h2>

  <div id="productionList" class="production-list"></div>
</section>

      <section class="section">
  <h2 class="section-title">ORDER MANAGEMENT</h2>

  <div id="managementList" class="management-list"></div>
</section>

    <section class="section">
      <h2 class="section-title">ARCHIVE</h2>

      <div id="archiveList" class="management-list"></div>
    </section>


    <footer class="internal-footer">
      HEAVENLY &amp; CRUMB • CEO EYES ONLY ♡
    </footer>

  </main>

  <script>
 const orders = [
   {
    id: "TEST-001",
    customer: "Test Customer A",
    requestedDate: "2026-10-05",
    contactMethod: "Text Message",
    orderMethod: "Brackettville Pickup",
    slicing: "Yes — Pre-Slice",
    status: "Confirmed",
    total: 113,

items: [
  {
    name: "The Heavenly Loaf",
    quantity: 3
  },
  {
    name: "Hellapeño Cheese™",
    quantity: 2
  },
  {
    name: "Honey Oat",
    quantity: 2
  },
  {
    name: "Heavenly Chocolate Chunk — Dozen",
    quantity: 2
  }
]
 },

  {
    id: "TEST-002",
    customer: "Test Customer B",
    requestedDate: "2026-10-06",
    contactMethod: "Email",
    orderMethod: "Del Rio Delivery",
    slicing: "No — Leave Whole",
    status: "Confirmed",
    total: 65,

    items: [
      {
        name: "Hellapeño Cheese™",
        quantity: 2
      },
      {
        name: "Honey Oat",
        quantity: 1
      },
      {
        name: "Heavenly Chocolate Chunk — Dozen",
        quantity: 1
      }
    ]
  }
];

    function renderOrders() {
  const ordersList =
    document.getElementById("ordersList");

  const activeOrders = orders
    .filter(order => {
      return (
        order.status !== "Complete" &&
        order.status !== "Archive"
        );
    })
    .sort((a, b) => {
      return (
        new Date(a.requestedDate) -
        new Date(b.requestedDate)
      );
    });

  if (activeOrders.length === 0) {
    ordersList.innerHTML =
      '<p class="empty-orders">No upcoming orders. ♡</p>';

    return;
  }

  ordersList.innerHTML = activeOrders
    .map(order => {
      const requestedDate = new Date(
        order.requestedDate + "T12:00:00"
      );

      const formattedDate =
        requestedDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
          .toUpperCase();

      const items = order.items
        .map(item => {
          return `
            <p class="order-item">
              ${item.name} ×${item.quantity}
            </p>
          `;
        })
        .join("");

      return `
        <article class="order-card">

          <div class="order-top">
            <div>
              <p class="order-date">
                ${formattedDate}
              </p>

              <h3 class="order-customer">
                ${order.customer}
              </h3>
            </div>

            <div class="order-total">
              $${order.total.toFixed(2).replace(".00", "")}
            </div>
          </div>

          <div class="order-items">
            ${items}
          </div>

          <div class="order-details">
            <span class="order-tag">
              ${order.orderMethod}
            </span>

            <span class="order-tag">
              ${order.slicing}
            </span>

            <span class="order-tag order-status">
              ${order.status}
            </span>
          </div>

        </article>
      `;
    })
    .join("");
}


    function renderProduction() {
  const productionList =
    document.getElementById("productionList");

  const activeOrders = orders.filter(order => {
    return (
      order.status !== "Complete" &&
      order.status !== "Archive"
      );
  });

  if (activeOrders.length === 0) {
    productionList.innerHTML =
      '<p class="empty-production">Nothing to bake right now. ♡</p>';

    return;
  }

  const productionTotals = {};
  let slicingTotal = 0;

  activeOrders.forEach(order => {
    order.items.forEach(item => {
      let productionName = item.name;
      let productionQuantity = item.quantity;

      if (
        item.name ===
        "Heavenly Chocolate Chunk — Dozen"
      ) {
        productionName =
          "Heavenly Chocolate Chunk";

        productionQuantity =
          item.quantity * 12;
      }

      if (!productionTotals[productionName]) {
        productionTotals[productionName] = 0;
      }

      productionTotals[productionName] +=
        productionQuantity;
    });

    if (order.slicing === "Yes — Pre-Slice") {
      order.items.forEach(item => {
        const sliceableLoaves = [
          "The Heavenly Loaf",
          "Hellapeño Cheese™",
          "Honey Oat"
        ];

        if (sliceableLoaves.includes(item.name)) {
          slicingTotal += item.quantity;
        }
      });
    }
  });

  const productionRows =
    Object.entries(productionTotals)
      .map(([name, quantity]) => {
        return `
          <div class="production-row">
            <span class="production-name">
              ${name}
            </span>

            <strong class="production-quantity">
              ${quantity}
            </strong>
          </div>
        `;
      })
      .join("");

  productionList.innerHTML = `
    <div class="production-card">
      <p class="production-heading">
        BAKES NEEDED
      </p>

      ${productionRows}
    </div>

    <div class="production-card">
      <p class="production-heading">
        SLICING
      </p>

      <div class="production-row">
        <span class="production-name">
          Loaves to pre-slice
        </span>

        <strong class="production-quantity">
          ${slicingTotal}
        </strong>
      </div>
    </div>
  `;
}

    function renderManagement() {
  const managementList =
    document.getElementById("managementList");

  const managementOrders = orders.filter(order => {
    return order.status !== "Archive";
  });

  if (managementOrders.length === 0) {
    managementList.innerHTML =
      '<p class="empty-management">No orders to manage. ♡</p>';

    return;
  }

  managementList.innerHTML = managementOrders
    .map(order => {
      const statuses = [
        "Confirmed",
        "Baking",
        "Complete",
        "Archive"
      ];

      const buttons = statuses
        .map(status => {
          const activeClass =
            order.status === status
              ? " active"
              : "";

          return `
            <button
              type="button"
              class="status-button${activeClass}"
              onclick="changeOrderStatus('${order.id}', '${status}')"
            >
              ${status}
            </button>
          `;
        })
        .join("");

      return `
        <div class="management-card">
          <div class="management-top">
            <div>
              <p class="management-id">
                ${order.id}
              </p>

              <h3 class="management-customer">
                ${order.customer}
              </h3>
            </div>

            <span class="management-status">
              ${order.status}
            </span>
          </div>

          <div class="status-buttons">
            ${buttons}
          </div>
        </div>
      `;
    })
    .join("");
}

function renderArchive() {
  const archiveList =
    document.getElementById("archiveList");

  const archivedOrders = orders.filter(order => {
    return order.status === "Archive";
  });

  if (archivedOrders.length === 0) {
    archiveList.innerHTML =
      '<p class="empty-management">No archived orders. ♡</p>';

    return;
  }

  archiveList.innerHTML = archivedOrders
    .map(order => {
      const requestedDate = new Date(
        order.requestedDate + "T12:00:00"
      );

      const formattedDate =
        requestedDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
            year: "numeric"
          })
          .toUpperCase();

      return `
        <div class="management-card">
          <div class="management-top">
            <div>
              <p class="management-id">
                ${order.id} • ${formattedDate}
              </p>

              <h3 class="management-customer">
                ${order.customer}
              </h3>
            </div>

            <span class="management-status">
              ARCHIVED
            </span>
          </div>

          <div class="order-details">
            <span class="order-tag">
              ${order.orderMethod}
            </span>

            <span class="order-tag">
              $${order.total.toFixed(2).replace(".00", "")}
            </span>
          </div>
        </div>
      `;
    })
    .join("");
}


  managementList.innerHTML = orders
    .map(order => {
      const statuses = [
        "Confirmed",
        "Baking",
        "Complete",
        "Archive"
      ];

      const buttons = statuses
        .map(status => {
          const activeClass =
            order.status === status
              ? " active"
              : "";

          return `
            <button
              type="button"
              class="status-button${activeClass}"
              onclick="changeOrderStatus('${order.id}', '${status}')"
            >
              ${status}
            </button>
          `;
        })
        .join("");

      return `
        <div class="management-card">
          <div class="management-top">
            <div>
              <p class="management-id">
                ${order.id}
              </p>

              <h3 class="management-customer">
                ${order.customer}
              </h3>
            </div>

            <span class="management-status">
              ${order.status}
            </span>
          </div>

          <div class="status-buttons">
            ${buttons}
          </div>
        </div>
      `;
    })
    .join("");
}

function changeOrderStatus(orderId, newStatus) {
  const order = orders.find(order => {
    return order.id === orderId;
  });

  if (!order) {
    return;
  }

  order.status = newStatus;

  updateOverview();
  renderOrders();
  renderProduction();
  renderManagement();
  renderArchive();
}

  function updateOverview() {
    const upcomingCount =
      document.getElementById("upcomingCount");

    const expectedSales =
      document.getElementById("expectedSales");

    const nextBakeDay =
      document.getElementById("nextBakeDay");

    const itemsToBake =
      document.getElementById("itemsToBake");

    const activeOrders = orders.filter(order => {
      return (
        order.status !== "Complete" &&
        order.status !== "Archive"
        );
    });

    const totalSales = activeOrders.reduce(
      (total, order) => total + order.total,
      0
    );

    const totalItems = activeOrders.reduce(
      (total, order) => {
        return total + order.items.reduce(
          (itemTotal, item) =>
            itemTotal + item.quantity,
          0
        );
      },
      0
    );

    const sortedOrders = [...activeOrders].sort(
      (a, b) =>
        new Date(a.requestedDate) -
        new Date(b.requestedDate)
    );

    upcomingCount.textContent =
      activeOrders.length;

    expectedSales.textContent =
      "$" + totalSales.toFixed(2).replace(".00", "");

    itemsToBake.textContent =
      totalItems;

    if (sortedOrders.length > 0) {
      const nextDate = new Date(
        sortedOrders[0].requestedDate + "T12:00:00"
      );

      nextBakeDay.textContent =
        nextDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
          .toUpperCase();
    } else {
      nextBakeDay.textContent = "—";
    }
  }

  updateOverview();
    renderOrders();
    renderProduction();
    renderManagement();
    renderArchive();
</script>

</body>

</html>
