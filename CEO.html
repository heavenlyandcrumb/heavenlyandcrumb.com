<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CEO Workpage | Heavenly & Crumb</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F8F4EC;
      color: #1B2336;
    }

    .internal-header {
      padding: 32px 20px 24px;
      text-align: center;
    }

    .internal-label {
      margin: 0 0 8px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    .internal-header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: normal;
    }

    .internal-subtitle {
      margin: 8px 0 0;
      font-family: Georgia, serif;
      font-size: 15px;
      font-style: italic;
      opacity: 0.7;
    }

    .workpage {
      width: min(100% - 32px, 900px);
      margin: 0 auto 60px;
    }

    .section {
      margin-top: 32px;
    }

    .section-title {
      margin: 0 0 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    .overview-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat-card {
  min-height: 118px;
  padding: 16px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.stat-label {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  line-height: 1.4;
  opacity: 0.55;
}

.stat-number {
  margin-top: 18px;
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
  color: #1B2336;
}

.stat-date {
  font-size: 24px;
}
    .card {
      background: #ffffff;
      border: 1px solid rgba(27, 35, 54, 0.12);
      border-radius: 14px;
      padding: 18px;
    }


    .orders-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.order-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.order-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.order-date {
  margin: 0 0 5px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.order-customer {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: normal;
}

.order-total {
  font-family: Georgia, serif;
  font-size: 22px;
  white-space: nowrap;
}

.order-items {
  margin: 16px 0;
  padding: 14px 0;
  border-top: 1px solid rgba(27, 35, 54, 0.10);
  border-bottom: 1px solid rgba(27, 35, 54, 0.10);
}

.order-item {
  margin: 4px 0;
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
}

     .order-contact {
  margin: 0 0 14px;
  padding: 12px 14px;
  background: #F8F4EC;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.7;
}

.order-contact a {
  color: #1B2336;
  text-decoration: none;
  font-weight: bold;
}

.order-contact-label {
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.55;
}

.order-details {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.order-tag {
  padding: 6px 8px;
  border: 1px solid rgba(27, 35, 54, 0.14);
  border-radius: 999px;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.order-status {
  background: #1B2336;
  color: #F8F4EC;
  border-color: #1B2336;
}

    
.production-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.production-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.production-heading {
  margin: 0 0 12px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.production-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 9px 0;
  border-top: 1px solid rgba(27, 35, 54, 0.08);
}

.production-row:first-of-type {
  border-top: none;
}

.production-name {
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.4;
}

.production-quantity {
  flex-shrink: 0;
  font-family: Georgia, serif;
  font-size: 23px;
}

    .management-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.management-card {
  padding: 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
}

.management-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 14px;
}

.management-id {
  margin: 0 0 5px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.management-customer {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: normal;
}

.management-status {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.status-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.status-button {
  padding: 10px 5px;
  border: 1px solid rgba(27, 35, 54, 0.18);
  border-radius: 999px;
  background: transparent;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  cursor: pointer;
}

.status-button.active {
  background: #1B2336;
  color: #F8F4EC;
  border-color: #1B2336;
}

    .edit-order-button {
  margin-top: 7px;
  padding: 6px 12px;
  border: 1px solid rgba(27, 35, 54, 0.22);
  border-radius: 999px;
  background: transparent;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
}

    .order-editor {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(27, 35, 54, 0.10);
}

.order-editor.show {
  display: block;
}

.editor-heading {
  margin: 0 0 14px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 1.4px;
  opacity: 0.55;
}

.editor-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.editor-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.editor-field-full {
  grid-column: 1 / -1;
}

.editor-label {
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.55;
}

.editor-input,
.editor-select,
.editor-textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid rgba(27, 35, 54, 0.16);
  border-radius: 9px;
  background: #F8F4EC;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 12px;
  outline: none;
}

.editor-textarea {
  min-height: 80px;
  resize: vertical;
}

    .editor-products {
  grid-column: 1 / -1;
  padding: 14px;
  background: #F8F4EC;
  border-radius: 10px;
}

.editor-products-heading {
  margin: 0 0 10px;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0.55;
}

.editor-product-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 8px 0;
  border-top: 1px solid rgba(27, 35, 54, 0.08);
}

.editor-product-row:first-of-type {
  border-top: none;
}

  .editor-add-product {
  width: 100%;
  margin-top: 10px;
  padding: 9px 12px;
  border: 1px dashed rgba(27, 35, 54, 0.25);
  border-radius: 9px;
  background: transparent;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  cursor: pointer;
}

.editor-add-product:hover {
  background: rgba(27, 35, 54, 0.04);
}

.editor-product-name {
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.4;
}

.editor-quantity {
  width: 70px;
  padding: 8px;
  border: 1px solid rgba(27, 35, 54, 0.16);
  border-radius: 8px;
  background: #ffffff;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 12px;
  text-align: center;
}

.editor-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

.editor-action-button {
  padding: 8px 14px;
  border: 1px solid rgba(27, 35, 54, 0.22);
  border-radius: 999px;
  background: transparent;
  color: #1B2336;
  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
}

.editor-action-button.primary {
  background: #1B2336;
  color: #F8F4EC;
  border-color: #1B2336;
}

@media (max-width: 600px) {
  .editor-grid {
    grid-template-columns: 1fr;
  }

  .editor-field-full {
    grid-column: auto;
  }
}

    .archive-toggle {
  width: 100%;
  padding: 0 0 12px;
  border: none;
  background: transparent;
  color: #1B2336;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: Arial, sans-serif;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  opacity: 0.65;
  cursor: pointer;
}

.archive-list {
  display: none;
}

.archive-list.show {
  display: flex;
}

#archiveArrow {
  font-size: 18px;
  line-height: 1;
}

.empty-management {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}

.empty-production {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}
    
.empty-orders {
  margin: 0;
  padding: 24px 18px;
  background: #ffffff;
  border: 1px solid rgba(27, 35, 54, 0.12);
  border-radius: 14px;
  text-align: center;
  font-family: Georgia, serif;
  font-size: 15px;
  font-style: italic;
  opacity: 0.65;
}
    
    .placeholder {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.65;
    }

    .internal-footer {
      margin-top: 40px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.5px;
      opacity: 0.45;
    }

    @media (min-width: 700px) {
      .internal-header {
        padding-top: 48px;
      }

      .internal-header h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header class="internal-header">
    <p class="internal-label">
      HEAVENLY &amp; CRUMB • INTERNAL
    </p>

    <h1>CEO Workpage</h1>

    <p class="internal-subtitle">
      Command center ♡
    </p>
  </header>

  <main class="workpage">

  <section class="section">
  <h2 class="section-title">OVERVIEW</h2>

  <div class="overview-grid">

    <div class="stat-card">
      <span class="stat-label">UPCOMING ORDERS</span>
      <strong class="stat-number" id="upcomingCount">0</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">EXPECTED SALES</span>
      <strong class="stat-number" id="expectedSales">$0</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">NEXT BAKE DAY</span>
      <strong class="stat-number stat-date" id="nextBakeDay">—</strong>
    </div>

    <div class="stat-card">
      <span class="stat-label">ITEMS TO BAKE</span>
      <strong class="stat-number" id="itemsToBake">0</strong>
    </div>

  </div>
</section>

    <section class="section">
  <h2 class="section-title">UPCOMING ORDERS</h2>

  <div id="ordersList" class="orders-list"></div>
</section>


    <section class="section">
  <h2 class="section-title">PRODUCTION</h2>

  <div id="productionList" class="production-list"></div>
</section>

      <section class="section">
  <h2 class="section-title">ORDER MANAGEMENT</h2>

  <div id="managementList" class="management-list"></div>
</section>

    <section class="section">
  <button
    type="button"
    class="archive-toggle"
    id="archiveToggle"
    onclick="toggleArchive()"
  >
    <span id="archiveTitle">ARCHIVE · 0 ORDERS</span>
    <span id="archiveArrow">⌄</span>
  </button>

  <div
    id="archiveList"
    class="management-list archive-list"
  ></div>
</section>

    <footer class="internal-footer">
      HEAVENLY &amp; CRUMB • CEO EYES ONLY ♡
    </footer>

  </main>

  <script>
 let orders = [];

async function loadOrders() {
  try {
    const response = await fetch("/api/orders");

    if (!response.ok) {
      throw new Error(
        `Order API returned ${response.status}`
      );
    }

    const data = await response.json();

    orders = data.orders || [];

    updateOverview();
    renderOrders();
    renderProduction();
    renderManagement();
    renderArchive();
  } catch (error) {
    console.error(
      "Could not load Heavenly & Crumb orders:",
      error
    );
  }
}

    function renderOrders() {
  const ordersList =
    document.getElementById("ordersList");

  const activeOrders = orders
    .filter(order => {
      return (
        order.status !== "Complete" &&
        order.status !== "Archive"
        );
    })
    .sort((a, b) => {
      return (
        new Date(a.requestedDate) -
        new Date(b.requestedDate)
      );
    });

  if (activeOrders.length === 0) {
    ordersList.innerHTML =
      '<p class="empty-orders">No upcoming orders. ♡</p>';

    return;
  }

  ordersList.innerHTML = activeOrders
    .map(order => {
      const requestedDate = new Date(
        order.requestedDate + "T12:00:00"
      );

      const formattedDate =
        requestedDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
          .toUpperCase();

      const items = order.items
        .map(item => {
          return `
            <p class="order-item">
              ${item.name} ×${item.quantity}
            </p>
          `;
        })
        .join("");

      return `
        <article class="order-card">

          <div class="order-top">
            <div>
              <p class="management-id">
                ${order.id} • ${formattedDate}
              </p>

              <h3 class="order-customer">
                ${order.customer}
              </h3>
            </div>

            <div class="order-total">
              $${order.total.toFixed(2).replace(".00", "")}
            </div>
          </div>

          <div class="order-items">
            ${items}
          </div>

           <div class="order-contact">
            <div>
              <span class="order-contact-label">CONTACT VIA</span>
              ${order.contactMethod || "Not specified"}
            </div>

            <div>
              <span class="order-contact-label">PHONE</span>
              <a href="tel:${order.phone || ""}">
                ${order.phone || "Not provided"}
              </a>
            </div>

            <div>
              <span class="order-contact-label">EMAIL</span>
              ${
                order.email
                  ? `<a href="mailto:${order.email}">${order.email}</a>`
                  : "Not provided"
              }
            </div>

            ${
              order.notes
                ? `
                  <div>
                    <span class="order-contact-label">NOTES</span>
                    ${order.notes}
                  </div>
                `
                : ""
            }
          </div>

          <div class="order-details">
            <span class="order-tag">
              ${order.orderMethod}
            </span>

            <span class="order-tag">
              ${order.slicing}
            </span>

            <span class="order-tag order-status">
              ${order.status}
            </span>
          </div>

        </article>
      `;
    })
    .join("");
}


    function renderProduction() {
  const productionList =
    document.getElementById("productionList");

  const activeOrders = orders.filter(order => {
    return (
      order.status !== "Complete" &&
      order.status !== "Archive"
      );
  });

  if (activeOrders.length === 0) {
    productionList.innerHTML =
      '<p class="empty-production">Nothing to bake right now. ♡</p>';

    return;
  }

  const productionTotals = {};
  let slicingTotal = 0;

  activeOrders.forEach(order => {
    order.items.forEach(item => {
      let productionName = item.name;
      let productionQuantity = item.quantity;

      if (
        item.name ===
        "Heavenly Chocolate Chunk — Dozen"
      ) {
        productionName =
          "Heavenly Chocolate Chunk";

        productionQuantity =
          item.quantity * 12;
      }

      if (!productionTotals[productionName]) {
        productionTotals[productionName] = 0;
      }

      productionTotals[productionName] +=
        productionQuantity;
    });

    if (order.slicing === "Yes — Pre-Slice") {
      order.items.forEach(item => {
        const sliceableLoaves = [
          "The Heavenly Loaf",
          "Hellapeño Cheese™",
          "Honey Oat"
        ];

        if (sliceableLoaves.includes(item.name)) {
          slicingTotal += item.quantity;
        }
      });
    }
  });

  const productionRows =
    Object.entries(productionTotals)
      .map(([name, quantity]) => {
        return `
          <div class="production-row">
            <span class="production-name">
              ${name}
            </span>

            <strong class="production-quantity">
              ${quantity}
            </strong>
          </div>
        `;
      })
      .join("");

  productionList.innerHTML = `
    <div class="production-card">
      <p class="production-heading">
        BAKES NEEDED
      </p>

      ${productionRows}
    </div>

    <div class="production-card">
      <p class="production-heading">
        SLICING
      </p>

      <div class="production-row">
        <span class="production-name">
          Loaves to pre-slice
        </span>

        <strong class="production-quantity">
          ${slicingTotal}
        </strong>
      </div>
    </div>
  `;
}

    function renderManagement() {
  const managementList =
    document.getElementById("managementList");

  const managementOrders = orders.filter(order => {
    return order.status !== "Archive";
  });

  if (managementOrders.length === 0) {
    managementList.innerHTML =
      '<p class="empty-management">No orders to manage. ♡</p>';

    return;
  }

  managementList.innerHTML = managementOrders
    .map(order => {
      const statuses = [
        "Confirmed",
        "Baking",
        "Complete",
        "Archive"
      ];

      const buttons = statuses
        .map(status => {
          const activeClass =
            order.status === status
              ? " active"
              : "";

          return `
            <button
              type="button"
              class="status-button${activeClass}"
              onclick="changeOrderStatus('${order.id}', '${status}')"
            >
              ${status}
            </button>
          `;
        })
        .join("");

    const productRows = order.items
        .map((item, index) => {
          return `
            <div class="editor-product-row">
              <span class="editor-product-name">
                ${item.name}
              </span>

              <input
                type="number"
                class="editor-quantity"
                id="edit-item-${order.id}-${index}"
                data-product="${item.name}"
                min="0"
                max="100"
                step="1"
                value="${item.quantity}"
              >
            </div>
          `;
        })
        .join("");

      return `
        <div class="management-card">
          <div class="management-top">
            <div>
              <p class="management-id">
                ${order.id}
              </p>

              <h3 class="management-customer">
                ${order.customer}
              </h3>
            </div>

            <div>
              <div class="management-status">
                ${order.status}
              </div>

              <button
                type="button"
                class="edit-order-button"
                onclick="openOrderEditor('${order.id}')"
              >
                EDIT
              </button>
            </div>
          </div>

            <div class="status-buttons">
            ${buttons}
          </div>

          <div
            class="order-editor"
            id="editor-${order.id}"
          >
            <p class="editor-heading">
              EDIT ORDER • ${order.id}
            </p>

            <div class="editor-grid">

              <label class="editor-field">
                <span class="editor-label">
                  Customer Name
                </span>

                <input
                  type="text"
                  class="editor-input"
                  id="edit-name-${order.id}"
                  value="${order.customer || ""}"
                >
              </label>

              <label class="editor-field">
                <span class="editor-label">
                  Requested Date
                </span>

                <input
                  type="date"
                  class="editor-input"
                  id="edit-date-${order.id}"
                  value="${order.requestedDate || ""}"
                >
              </label>

              <label class="editor-field">
                <span class="editor-label">
                  Phone
                </span>

                <input
                  type="tel"
                  class="editor-input"
                  id="edit-phone-${order.id}"
                  value="${order.phone || ""}"
                >
              </label>

              <label class="editor-field">
                <span class="editor-label">
                  Email
                </span>

                <input
                  type="email"
                  class="editor-input"
                  id="edit-email-${order.id}"
                  value="${order.email || ""}"
                >
              </label>

              <label class="editor-field">
                <span class="editor-label">
                  Preferred Contact
                </span>

                <select
                  class="editor-select"
                  id="edit-contact-${order.id}"
                >
                  <option
                    value="Text Message"
                    ${order.contactMethod === "Text Message" ? "selected" : ""}
                  >
                    Text Message
                  </option>

                  <option
                    value="Email"
                    ${order.contactMethod === "Email" ? "selected" : ""}
                  >
                    Email
                  </option>

                  <option
                    value="Phone Call"
                    ${order.contactMethod === "Phone Call" ? "selected" : ""}
                  >
                    Phone Call
                  </option>
                </select>
              </label>

              <label class="editor-field">
                <span class="editor-label">
                  Order Method
                </span>

                <select
                  class="editor-select"
                  id="edit-method-${order.id}"
                >
                  <option
                    value="Brackettville Pickup"
                    ${order.orderMethod === "Brackettville Pickup" ? "selected" : ""}
                  >
                    Brackettville Pickup
                  </option>

                  <option
                    value="Brackettville Delivery"
                    ${order.orderMethod === "Brackettville Delivery" ? "selected" : ""}
                  >
                    Brackettville Delivery
                  </option>

                  <option
                    value="Del Rio Delivery"
                    ${order.orderMethod === "Del Rio Delivery" ? "selected" : ""}
                  >
                    Del Rio Delivery
                  </option>
                </select>
              </label>

              <div class="editor-products">
                <p class="editor-products-heading">
                  Products & Quantities
                </p>

                ${productRows}

                <button
                  type="button"
                  class="editor-add-product"
                  onclick="addProductToEditor('${order.id}')"
                >
                  + ADD PRODUCT
                </button>
              </div>

              <label class="editor-field editor-field-full">
                <span class="editor-label">
                  Slicing
                </span>

                <select
                  class="editor-select"
                  id="edit-slicing-${order.id}"
                >
                  <option
                    value="No — Leave Whole"
                    ${order.slicing === "No — Leave Whole" ? "selected" : ""}
                  >
                    No — Leave Whole
                  </option>

                  <option
                    value="Yes — Pre-Slice"
                    ${order.slicing === "Yes — Pre-Slice" ? "selected" : ""}
                  >
                    Yes — Pre-Slice
                  </option>
                </select>
              </label>

              <label class="editor-field editor-field-full">
                <span class="editor-label">
                  Notes
                </span>

                <textarea
                  class="editor-textarea"
                  id="edit-notes-${order.id}"
                >${order.notes || ""}</textarea>
              </label>

            </div>

            <div class="editor-actions">
              <button
                type="button"
                class="editor-action-button"
                onclick="closeOrderEditor('${order.id}')"
              >
                CANCEL
              </button>

              <button
                type="button"
                class="editor-action-button primary"
                onclick="saveOrderChanges('${order.id}')"
              >
                SAVE CHANGES
              </button>
            </div>
          </div>
        </div>
      `;
    })
    .join("");
}

function renderArchive() {
  const archiveList =
    document.getElementById("archiveList");

  const archivedOrders = orders.filter(order => {
    return order.status === "Archive";
  });

  const archiveTitle =
  document.getElementById("archiveTitle");

archiveTitle.textContent =
  `ARCHIVE · ${archivedOrders.length} ${
    archivedOrders.length === 1
      ? "ORDER"
      : "ORDERS"
  }`;

  if (archivedOrders.length === 0) {
    archiveList.innerHTML =
      '<p class="empty-management">No archived orders. ♡</p>';

    return;
  }

  archiveList.innerHTML = archivedOrders
    .map(order => {
      const requestedDate = new Date(
        order.requestedDate + "T12:00:00"
      );

      const formattedDate =
        requestedDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
            year: "numeric"
          })
          .toUpperCase();

      return `
        <div class="management-card">
          <div class="management-top">
            <div>
              <p class="management-id">
                ${order.id} • ${formattedDate}
              </p>

              <h3 class="management-customer">
                ${order.customer}
              </h3>
            </div>

            <span class="management-status">
              ARCHIVED
            </span>
          </div>

          <div class="order-details">
            <span class="order-tag">
              ${order.orderMethod}
            </span>

            <span class="order-tag">
              $${order.total.toFixed(2).replace(".00", "")}
            </span>

            <button
            type="button"
            class="status-button"
            onclick="changeOrderStatus('${order.id}', 'Complete')"
            >
            RESTORE
            </button>
          </div>
        </div>
      `;
    })
    .join("");
}

    function toggleArchive() {
  const archiveList =
    document.getElementById("archiveList");

  const archiveArrow =
    document.getElementById("archiveArrow");

  const isOpen =
    archiveList.classList.toggle("show");

  archiveArrow.textContent =
    isOpen ? "⌃" : "⌄";
}

    function addProductToEditor(orderId) {
  const editor =
    document.getElementById(
      `editor-${orderId}`
    );

  if (!editor) {
    return;
  }

  const productsContainer =
    editor.querySelector(
      ".editor-products"
    );

  if (!productsContainer) {
    return;
  }

  const existingSelector =
    productsContainer.querySelector(
      ".editor-new-product-row"
    );

  if (existingSelector) {
    return;
  }

  const row =
    document.createElement("div");

  row.className =
    "editor-product-row editor-new-product-row";

  row.innerHTML = `
    <select
      class="editor-select editor-new-product-select"
    >
      <option value="">
        Select product
      </option>

      <option value="The Heavenly Loaf">
        The Heavenly Loaf
      </option>

      <option value="Hellapeño Cheese™">
        Hellapeño Cheese™
      </option>

      <option value="Honey Oat">
        Honey Oat
      </option>

      <option value="Heavenly Chocolate Chunk - 3-Pack">
        Heavenly Chocolate Chunk - 3-Pack
      </option>

      <option value="Heavenly Chocolate Chunk - Dozen">
        Heavenly Chocolate Chunk - Dozen
      </option>
    </select>

    <input
      type="number"
      class="editor-quantity editor-new-product-quantity"
      min="1"
      max="100"
      step="1"
      value="1"
    >
  `;

  const select =
    row.querySelector(
      ".editor-new-product-select"
    );

  select.addEventListener("change", () => {
    finalizeAddedProduct(
      orderId,
      row,
      select.value
    );
  });

  const addButton =
    productsContainer.querySelector(
      ".editor-add-product"
    );

  productsContainer.insertBefore(
    row,
    addButton
  );
}

    function finalizeAddedProduct(
  orderId,
  row,
  productName
) {
  if (!productName) {
    return;
  }

  const editor =
    document.getElementById(
      `editor-${orderId}`
    );

  if (!editor) {
    return;
  }

  const existingProducts =
    Array.from(
      editor.querySelectorAll(
        "[data-product]"
      )
    );

  const duplicate =
    existingProducts.some(input => {
      return (
        input.dataset.product ===
        productName
      );
    });

  if (duplicate) {
    alert(
      `${productName} is already on this order ♡`
    );

    const select =
      row.querySelector(
        ".editor-new-product-select"
      );

    if (select) {
      select.value = "";
    }

    return;
  }

  const quantityInput =
    row.querySelector(
      ".editor-new-product-quantity"
    );

  const quantity =
    quantityInput
      ? quantityInput.value
      : 1;

  row.innerHTML = `
    <span class="editor-product-name">
      ${productName}
    </span>

    <input
      type="number"
      class="editor-quantity"
      data-product="${productName}"
      min="0"
      max="100"
      step="1"
      value="${quantity}"
    >
  `;

  row.classList.remove(
    "editor-new-product-row"
  );
}

    function openOrderEditor(orderId) {
  const editor =
    document.getElementById(
      `editor-${orderId}`
    );

  if (!editor) {
    alert("Could not open that order ♡");
    return;
  }

  editor.classList.add("show");
}

function closeOrderEditor(orderId) {
  const editor =
    document.getElementById(
      `editor-${orderId}`
    );

  if (!editor) {
    return;
  }

  editor.classList.remove("show");
}

    async function saveOrderChanges(orderId) {
  const editor =
    document.getElementById(
      `editor-${orderId}`
    );

  if (!editor) {
    alert("Could not find that order editor ♡");
    return;
  }

  const name =
    document.getElementById(
      `edit-name-${orderId}`
    ).value.trim();

  const requestedDate =
    document.getElementById(
      `edit-date-${orderId}`
    ).value;

  const phone =
    document.getElementById(
      `edit-phone-${orderId}`
    ).value.trim();

  const email =
    document.getElementById(
      `edit-email-${orderId}`
    ).value.trim();

  const preferredContact =
    document.getElementById(
      `edit-contact-${orderId}`
    ).value;

  const orderMethod =
    document.getElementById(
      `edit-method-${orderId}`
    ).value;

  const slicing =
    document.getElementById(
      `edit-slicing-${orderId}`
    ).value;

  const notes =
    document.getElementById(
      `edit-notes-${orderId}`
    ).value.trim();

  const items =
    Array.from(
      editor.querySelectorAll(
        "[data-product]"
      )
    ).map(input => {
      return {
        name: input.dataset.product,
        quantity: Number(input.value)
      };
    });

  const remainingItems =
    items.filter(item => {
      return (
        Number.isInteger(item.quantity) &&
        item.quantity > 0
      );
    });

  if (!name) {
    alert("Customer name is required ♡");
    return;
  }

  if (!phone) {
    alert("Phone number is required ♡");
    return;
  }

  if (!requestedDate) {
    alert("Requested date is required ♡");
    return;
  }

  if (remainingItems.length === 0) {
    alert(
      "An order needs at least one product ♡"
    );
    return;
  }

  try {
    const response =
      await fetch("/api/orders", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          orderId: orderId,
          editOrder: true,
          name: name,
          phone: phone,
          email: email,
          preferredContact:
            preferredContact,
          requestedDate:
            requestedDate,
          orderMethod: orderMethod,
          slicing: slicing,
          notes: notes,
          items: items
        })
      });

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error ||
        `Order API returned ${response.status}`
      );
    }

    await loadOrders();

  } catch (error) {
    console.error(
      "Could not save order changes:",
      error
    );

    alert(
      "Could not save those changes. Please try again ♡"
    );
  }
}

async function changeOrderStatus(orderId, newStatus) {
  try {
    const response = await fetch("/api/orders", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        orderId: orderId,
        status: newStatus
      })
    });

    if (!response.ok) {
      throw new Error(
        `Order API returned ${response.status}`
      );
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(
        data.error || "Status update failed"
      );
    }

    await loadOrders();

  } catch (error) {
    console.error(
      "Could not update order status:",
      error
    );

    alert(
      "Could not update the order status. Please try again ♡"
    );
  }
}

  function updateOverview() {
    const upcomingCount =
      document.getElementById("upcomingCount");

    const expectedSales =
      document.getElementById("expectedSales");

    const nextBakeDay =
      document.getElementById("nextBakeDay");

    const itemsToBake =
      document.getElementById("itemsToBake");

    const activeOrders = orders.filter(order => {
      return (
        order.status !== "Complete" &&
        order.status !== "Archive"
        );
    });

    const totalSales = activeOrders.reduce(
      (total, order) => total + order.total,
      0
    );

    const totalItems = activeOrders.reduce(
      (total, order) => {
        return total + order.items.reduce(
          (itemTotal, item) =>
            itemTotal + item.quantity,
          0
        );
      },
      0
    );

    const sortedOrders = [...activeOrders].sort(
      (a, b) =>
        new Date(a.requestedDate) -
        new Date(b.requestedDate)
    );

    upcomingCount.textContent =
      activeOrders.length;

    expectedSales.textContent =
      "$" + totalSales.toFixed(2).replace(".00", "");

    itemsToBake.textContent =
      totalItems;

    if (sortedOrders.length > 0) {
      const nextDate = new Date(
        sortedOrders[0].requestedDate + "T12:00:00"
      );

      nextBakeDay.textContent =
        nextDate
          .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
          .toUpperCase();
    } else {
      nextBakeDay.textContent = "—";
    }
  }

loadOrders();
    
</script>
