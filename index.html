<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heavenly & Crumb | Artisan Sourdough & Sweet Treats</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #F8F4EC;
      color: #1B2336;
    }

    /* HEADER */

    nav {
      background: #1B2336;
      min-height: 90px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8%;
    }

    .logo {
      height: 65px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      color: #F8F4EC;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* MAIN HOMEPAGE */

    .hero {
      min-height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 45px 7% 0;
    }

    /* PHOTO STRIP */

    .bake-strip {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 38px;
    }

    .bake-photo {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      background: #E8E1D6;
    }

    /* TEMPORARY PLACEHOLDERS */

    .placeholder {
      height: 260px;
      background: #E8E1D6;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #1B2336;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
    }

    /* TAGLINE + ORDER */

    .hero-copy {
      text-align: center;
      max-width: 680px;
    }

    .tagline {
      font-size: 1.25rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .order-button {
      display: inline-block;
      background: #1B2336;
      color: #FFFFFF;
      text-decoration: none;
      padding: 16px 34px;
      border-radius: 50px;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1.2px;
      transition: transform 0.2s ease;
    }

    .order-button:hover {
      transform: translateY(-2px);
    }

    /* BOTTOM BRAND LINE */

    .details {
      width: 100vw;
      margin-top: 45px;
      text-align: center;
      padding: 28px 20px;
      border-top: 1px solid rgba(27, 35, 54, 0.15);
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 1.2px;
    }

    /* MOBILE */

    @media (max-width: 750px) {
      nav {
        min-height: 78px;
        padding: 10px 5%;
      }

      .logo {
        height: 55px;
      }

      .nav-links {
        display: none;
      }

      .hero {
        min-height: calc(100vh - 78px);
        padding: 28px 5% 0;
      }

      .bake-strip {
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
        margin-bottom: 30px;
      }

      .bake-photo,
      .placeholder {
        height: 180px;
      }

      .tagline {
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .details {
        margin-top: 35px;
        font-size: 0.68rem;
      }
    }
  </style>
</head>

<body>

  <nav>

    <!-- Your real logo will replace this temporary text -->
    <div style="
      color:#F8F4EC;
      font-size:1.25rem;
      font-weight:bold;
    ">
      Heavenly & Crumb ♡
    </div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Menu</a>
      <a href="#">Our Story</a>
      <a href="#">Contact</a>
    </div>

  </nav>

  <main class="hero">

    <section class="bake-strip">

      <div class="placeholder">
        BAKE PHOTO 01
      </div>

      <div class="placeholder">
        BAKE PHOTO 02
      </div>

      <div class="placeholder">
        BAKE PHOTO 03
      </div>

      <div class="placeholder">
        BAKE PHOTO 04
      </div>

    </section>

    <div class="hero-copy">

      <p class="tagline">
        Artisan sourdough and simply sweet treats,
        baked with love in Brackettville, Texas.
      </p>

      <a
        class="order-button"
        href="https://form.jotform.com/262486990061059"
        target="_blank"
        rel="noopener noreferrer"
      >
        ORDER NOW
      </a>

    </div>

    <footer class="details">
      SMALL BATCH • HOMEMADE • BRACKETTVILLE, TEXAS ♡
    </footer>

  </main>

</body>
</html>
